<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Playful Cat No Button</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #fce4ec;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            position: fixed;
        }

        .card {
            background: white;
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            width: 85%;
            max-width: 340px;
        }

        h1 {
            color: #880e4f;
            font-size: 1.5rem;
            margin-bottom: 24px;
        }

        .button-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            min-height: 50px;
            position: relative;
        }

        button {
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: 700;
            border: none;
            border-radius: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            -webkit-tap-highlight-color: transparent;
        }

        #yesBtn {
            background-color: #4caf50;
            color: white;
        }

        #noBtn {
            background-color: #f44336;
            color: white;
            position: fixed;
            z-index: 10;
            transition: top 0.15s ease-out, left 0.15s ease-out;
        }

        /* Animated CSS Cat */
        .cat-container {
            position: fixed;
            pointer-events: none;
            z-index: 20;
            display: none;
            transition: top 0.15s ease-out, left 0.15s ease-out;
        }

        .cat {
            position: relative;
            width: 70px;
            height: 52px;
            background: #ff9800;
            border-radius: 25px 25px 18px 18px;
        }

        /* Ears */
        .cat::before, .cat::after {
            content: '';
            position: absolute;
            top: -10px;
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 15px solid #ff9800;
        }
        .cat::before { left: 6px; transform: rotate(-10deg); }
        .cat::after { right: 6px; transform: rotate(10deg); }

        /* Face */
        .eyes {
            position: absolute;
            top: 16px;
            left: 14px;
            right: 14px;
            display: flex;
            justify-content: space-between;
        }

        .eye {
            width: 8px;
            height: 8px;
            background: #000;
            border-radius: 50%;
        }

        .paw {
            position: absolute;
            bottom: -8px;
            width: 20px;
            height: 14px;
            background: #ffe0b2;
            border-radius: 8px;
            border: 2px solid #ff9800;
        }
        .paw.left { left: 8px; }
        .paw.right { right: 8px; }

        .pounce-animation {
            animation: pounce 0.25s ease-out;
        }

        @keyframes pounce {
            0% { transform: scale(1); }
            50% { transform: scale(1.25) translateY(-8px); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Will you be my friend?</h1>
        <div class="button-container">
            <button id="yesBtn" onclick="alert('Yay! 🎉')">Yes</button>
            <button id="noBtn">No</button>
        </div>
    </div>

    <!-- Cat Element -->
    <div class="cat-container" id="cat">
        <div class="cat">
            <div class="eyes">
                <div class="eye"></div>
                <div class="eye"></div>
            </div>
            <div class="paw left"></div>
            <div class="paw right"></div>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const cat = document.getElementById('cat');

        // Align 'No' button initial position relative to layout
        window.addEventListener('load', setInitialPosition);
        window.addEventListener('resize', setInitialPosition);

        function setInitialPosition() {
            const yesRect = document.getElementById('yesBtn').getBoundingClientRect();
            noBtn.style.left = (yesRect.right + 20) + 'px';
            noBtn.style.top = yesRect.top + 'px';
        }

        function dodge(e) {
            if (e) e.preventDefault();

            const btnWidth = noBtn.offsetWidth;
            const btnHeight = noBtn.offsetHeight;
            const padding = 20;

            // Safe screen bounds for touch displays
            const maxX = window.innerWidth - btnWidth - padding;
            const maxY = window.innerHeight - btnHeight - padding;

            const newX = Math.max(padding, Math.floor(Math.random() * maxX));
            const newY = Math.max(padding, Math.floor(Math.random() * maxY));

            // Position cat above current button location
            cat.style.display = 'block';
            cat.style.left = (noBtn.offsetLeft - 10) + 'px';
            cat.style.top = (noBtn.offsetTop - 45) + 'px';

            // Trigger animation
            cat.classList.remove('pounce-animation');
            void cat.offsetWidth;
            cat.classList.add('pounce-animation');

            // Shift button and follow with cat
            noBtn.style.left = newX + 'px';
            noBtn.style.top = newY + 'px';

            setTimeout(() => {
                cat.style.left = (newX - 10) + 'px';
                cat.style.top = (newY - 45) + 'px';
            }, 80);
        }

        // Mobile touch events + desktop mouse fallback
        noBtn.addEventListener('touchstart', dodge, { passive: false });
        noBtn.addEventListener('pointerdown', dodge);
        noBtn.addEventListener('mouseover', dodge);
    </script>
</body>
</html>
